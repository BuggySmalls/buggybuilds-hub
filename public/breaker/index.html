<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Breaker · BuGGy Builds</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--paper:#F1EFEA; --ink:#111; --muted:#77736B; --line:#111; --red:#FF3B1F; --soft:#E4E1DA; --go:#1F9D55; color-scheme:light}
@media (prefers-color-scheme:dark){ :root{--paper:#121211; --ink:#F1EFEA; --muted:#8F8A80; --line:#F1EFEA; --soft:#262523; --go:#3DDC84; color-scheme:dark} }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{background:var(--paper); color:var(--ink); font:500 16px/1.4 'Inter Tight', system-ui, sans-serif; overflow-x:hidden}
button,input{font:inherit; color:inherit}
.mono{font:500 12px/1.5 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.04em}
.muted{color:var(--muted)}
.app{max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:0 18px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex; justify-content:space-between; align-items:center; padding:calc(12px + env(safe-area-inset-top)) 0 12px; border-bottom:2px solid var(--line)}
.top a{color:inherit; text-decoration:none} .top a:hover{color:var(--red)}
.net{display:inline-flex; align-items:center; gap:7px}
.net i{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.net.live i{background:var(--go)} .net.wait i{background:var(--red); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
h1{font:900 clamp(72px,24vw,132px)/.82 'Inter Tight'; letter-spacing:-.065em; margin:28px 0 14px -.04em}
h1 i{font-style:normal; color:var(--red)}
.lede{font-size:20px; line-height:1.2; letter-spacing:-.015em; margin:0 0 26px; max-width:26ch}
label{display:block; margin-bottom:14px}
label input{display:block; width:100%; margin-top:6px; background:transparent; border:0; border-bottom:2px solid var(--line); padding:8px 0; font:700 30px/1.1 'Inter Tight'; letter-spacing:-.03em; border-radius:0; outline:none; text-transform:none}
label input:focus{border-color:var(--red)}
#code{text-transform:uppercase}
.btn{width:100%; border:0; background:var(--red); color:#fff; font:700 24px 'Inter Tight'; letter-spacing:-.02em; padding:20px; border-radius:999px; margin-top:12px; cursor:pointer}
.btn:active{transform:scale(.98)}
.hint{margin:18px 0 0; color:var(--muted)}
.err{color:var(--red); margin-top:12px; min-height:1.5em}

#room{flex:1; display:flex; flex-direction:column; padding-top:14px; gap:12px}
.bar{display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
.bar b{display:block; font:900 38px/.95 'Inter Tight'; letter-spacing:-.04em}
.ghost{background:transparent; border:2px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer; white-space:nowrap}
.ghost:active{background:var(--soft)}
.seg{display:grid; grid-template-columns:1fr 1fr; border:2px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{border:0; background:transparent; padding:11px 6px; cursor:pointer}
.seg button.on{background:var(--ink); color:var(--paper)}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.row2{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center}
.people{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.people li{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--soft); font:700 22px/1.1 'Inter Tight'; letter-spacing:-.02em}
.people li .lv{width:12px; height:12px; border-radius:50%; background:var(--soft); flex:none; transition:transform .08s, background .15s}
.people li.talk .lv{background:var(--go)}
.people li.talk{color:var(--go)}
.people li .tag{margin-left:auto; color:var(--muted)}
.people li.off{color:var(--muted)}
.empty{color:var(--muted); padding:10px 0}

.big{flex:1; min-height:200px; position:relative; border:0; border-radius:28px; background:var(--go); color:#06210f; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; overflow:hidden; transition:background .15s}
.big .t{font:900 clamp(44px,13vw,72px)/.9 'Inter Tight'; letter-spacing:-.05em; position:relative}
.big .s{position:relative}
.big .ring{position:absolute; left:50%; top:50%; width:60%; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.28); transform:translate(-50%,-50%) scale(.2); transition:transform .07s linear}
.big.muted{background:var(--soft); color:var(--muted)}
.big.muted .t{color:var(--ink)}
.big.push{background:var(--soft); color:var(--muted)} .big.push .t{color:var(--ink)}
.big.push.held{background:var(--red); color:#fff} .big.push.held .t{color:#fff}
.big:disabled{opacity:.5}
.tools{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.tools button{padding:10px 4px}
.tools button.on{background:var(--ink); color:var(--paper)}
.note{color:var(--muted); margin:0; text-align:center}

#pocket{position:fixed; inset:0; background:#000; color:#444; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; touch-action:manipulation; user-select:none; -webkit-user-select:none}
#pocket[hidden]{display:none}
#pocketWho{font:700 28px 'Inter Tight'; color:#2c6; min-height:1.2em; letter-spacing:-.02em}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="app">
  <header class="top mono"><a href="/">← <span style="text-transform:none">BuGGy Builds</span></a><span class="net" id="net"><i></i><span id="netTxt">Offline</span></span></header>

  <section id="join">
    <h1>Breaker<i>.</i></h1>
    <p class="lede">Group voice for the mountain and the course. Same channel, everyone hears everyone.</p>
    <label class="mono">Your name<input id="name" maxlength="16" autocomplete="nickname" placeholder="Nick"></label>
    <label class="mono">Channel<input id="code" maxlength="16" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
    <button class="btn" id="go">Join channel</button>
    <div class="err mono" id="err"></div>
    <p class="hint mono">Allow the mic when asked. Earbuds work best. Keep this page open: phones pause web pages when the screen locks.</p>
  </section>

  <section id="room" hidden>
    <div class="bar">
      <div><span class="mono muted">Channel</span><b id="chan">—</b></div>
      <button class="ghost mono" id="share">Invite</button>
    </div>
    <div class="seg mono" id="modeSeg"><button data-mode="open" class="on">Open mic</button><button data-mode="push">Push to talk</button></div>
    <div class="row2" id="windRow"><span class="mono muted">Wind</span><div class="seg three mono" id="windSeg"><button data-w="calm">Calm</button><button data-w="breezy" class="on">Breezy</button><button data-w="windy">Windy</button></div></div>
    <ul class="people" id="people"></ul>
    <button class="big" id="big" aria-live="polite"><span class="ring" id="ring"></span><span class="t" id="bigT">Live</span><span class="s mono" id="bigS">Tap to mute</span></button>
    <div class="tools mono">
      <button class="ghost" id="wake">Screen on</button>
      <button class="ghost" id="pocketBtn">Pocket</button>
      <button class="ghost" id="spk">Speaker</button>
      <button class="ghost" id="leave">Leave</button>
    </div>
  </section>
</div>

<div id="pocket" hidden><div id="pocketWho"></div><div class="mono" id="pocketMe">Live</div><div class="mono">Double-tap to wake</div></div>

<script>
/* Breaker: full-duplex group voice over one WebSocket per phone.
   Mic → high-pass (wind rumble) → low-pass → AudioWorklet: resample to 16 kHz, voice gate,
   G.711 µ-law, 40 ms frames. The Worker relays each frame to the others tagged with a slot byte.
   Each sender gets its own little jitter buffer; Web Audio mixes them. */
const RATE = 16000, FRAME = 640;
const KEY = 'buggybuilds.breaker.v1';
const $ = s => document.querySelector(s);
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
if (!saved.cid) { saved.cid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); save(); }

const WORDS = ['PEAK','POW','LIFT','GLADE','CHAIR','BIRDIE','EAGLE','FAIRWAY','PIN','TEE','SLOPE','DROP'];
const randCode = () => WORDS[Math.random() * WORDS.length | 0] + '-' + (10 + Math.random() * 90 | 0);
const cleanCode = s => (s || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);

const S = { ws: null, joined: false, me: -1, people: [], code: '', mode: saved.mode || 'open', wind: saved.wind || 'breezy',
  muted: false, held: false, mic: false, retry: 0, lastPong: 0, senders: new Map(), wake: null, wantWake: true, spk: 1 };

/* ---------- join screen ---------- */
const qs = new URLSearchParams(location.search);
$('#code').value = cleanCode(qs.get('c')) || saved.code || randCode();
$('#name').value = saved.name || '';
$('#go').onclick = join;
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

async function join() {
  const name = $('#name').value.trim().slice(0, 16);
  const code = cleanCode($('#code').value);
  if (!name) { $('#err').textContent = 'Add your name'; $('#name').focus(); return; }
  if (code.length < 2) { $('#err').textContent = 'Pick a channel code'; $('#code').focus(); return; }
  $('#err').textContent = '';
  saved.name = name; saved.code = code; save();
  S.code = code; S.name = name;
  try { history.replaceState(null, '', '?c=' + encodeURIComponent(code)); } catch (e) {}
  $('#go').disabled = true; $('#go').textContent = 'Starting…';
  try { await startAudio(); } catch (e) { console.warn(e); }
  $('#go').disabled = false; $('#go').textContent = 'Join channel';
  if (!ac) { $('#err').textContent = 'This browser can’t play live audio'; return; }
  S.joined = true;
  $('#join').hidden = true; $('#room').hidden = false; $('#chan').textContent = code;
  setMode(S.mode, true); setWind(S.wind);
  connect();
  wakeOn();
  tone([660, 990], .09);
}

/* ---------- audio ---------- */
let ac, out, node, stream;
const WORKLET = `
const ENC = s => { let x = Math.max(-1, Math.min(1, s)) * 32767 | 0; let sign = 0; if (x < 0) { sign = 0x80; x = -x; } if (x > 32635) x = 32635; x += 0x84;
  let exp = 7; for (let m = 0x4000; (x & m) === 0 && exp > 0; exp--, m >>= 1); return ~(sign | (exp << 4) | ((x >> (exp + 3)) & 0x0F)) & 0xFF; };
class Cap extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / ${RATE}; this.t = 0; this.prevS = 0; this.buf = new Float32Array(${FRAME}); this.n = 0;
    this.send = false; this.gate = true; this.sens = 3; this.min = .014; this.floor = .01; this.hang = 0; this.was = false; this.pre = null;
    this.port.onmessage = e => Object.assign(this, e.data); }
  frame() {
    const b = this.buf; let sum = 0; for (let i = 0; i < b.length; i++) sum += b[i] * b[i];
    const rms = Math.sqrt(sum / b.length);
    if (rms < this.floor) this.floor += (rms - this.floor) * .3; else this.floor += (rms - this.floor) * .004;
    if (this.floor < .002) this.floor = .002;
    const thr = Math.max(this.floor * this.sens, this.min);
    if (!this.gate || rms > thr) this.hang = 18; // ~720 ms hangover so words don't get clipped
    const open = this.send && this.hang > 0; if (this.hang > 0) this.hang--;
    const enc = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) enc[i] = ENC(b[i]);
    if (open) { if (!this.was && this.pre) this.port.postMessage({ f: this.pre }, [this.pre.buffer]); this.port.postMessage({ f: enc, level: rms, open }, [enc.buffer]); this.pre = null; }
    else { this.pre = enc; this.port.postMessage({ level: rms, open }); }
    this.was = open;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
    const len = ch.length; let t = this.t;
    while (t <= len - 1) { const i = Math.floor(t), f = t - i; const a = i < 0 ? this.prevS : ch[i], c = ch[i + 1];
      this.buf[this.n++] = a + (c - a) * f; if (this.n === this.buf.length) { this.frame(); this.n = 0; } t += this.ratio; }
    this.t = t - len; this.prevS = ch[len - 1]; return true;
  }
}
registerProcessor('cap', Cap);`;

const ULAW = new Float32Array(256);
for (let i = 0; i < 256; i++) { const u = ~i & 0xFF, sign = u & 0x80, exp = (u >> 4) & 7, man = u & 0x0F; let x = (((man << 3) + 0x84) << exp) - 0x84; ULAW[i] = (sign ? -x : x) / 32768; }

async function startAudio() {
  if (ac) { try { await ac.resume(); } catch (e) {} return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC({ latencyHint: 'interactive' });
  try { await ac.resume(); } catch (e) {}
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
  out = ac.createGain(); out.gain.value = 1.6; out.connect(comp); comp.connect(ac.destination);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
    const src = ac.createMediaStreamSource(stream);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 150;   // wind rumble
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6800;    // anti-alias for 16 kHz
    node = new AudioWorkletNode(ac, 'cap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
    const sink = ac.createGain(); sink.gain.value = 0;
    src.connect(hp); hp.connect(lp); lp.connect(node); node.connect(sink); sink.connect(ac.destination);
    node.port.onmessage = onFrame;
    S.mic = true;
  } catch (e) {
    console.warn('mic', e); S.mic = false;
  }
}

let myLevel = 0, myOpen = false;
function onFrame(e) {
  const d = e.data;
  if (d.f && S.ws && S.ws.readyState === 1 && S.ws.bufferedAmount < 64000) S.ws.send(d.f);
  if (d.level !== undefined) { myLevel = d.level; myOpen = d.open; }
}
function pushWorklet() {
  if (!node) return;
  const send = S.mode === 'open' ? !S.muted : S.held;
  const w = { calm: [2.2, .008], breezy: [3, .014], windy: [4.5, .026] }[S.wind];
  node.port.postMessage({ send, gate: S.mode === 'open', sens: w[0], min: w[1] });
}

function play(buf) {
  if (!ac) return;
  const u8 = new Uint8Array(buf); if (u8.length < 2) return;
  const slot = u8[0], n = u8.length - 1;
  let p = S.senders.get(slot); if (!p) { p = { head: 0, last: 0, lvl: 0 }; S.senders.set(slot, p); }
  const now = ac.currentTime;
  if (p.head < now + .02) p.head = now + .1;        // new burst: small cushion for jitter
  if (p.head > now + .5) return;                    // fell behind: drop to catch up
  const b = ac.createBuffer(1, n, RATE), ch = b.getChannelData(0); let sum = 0;
  for (let i = 0; i < n; i++) { const v = ULAW[u8[i + 1]]; ch[i] = v; sum += v * v; }
  const s = ac.createBufferSource(); s.buffer = b; s.connect(out); s.start(p.head); p.head += b.duration;
  p.last = performance.now(); p.lvl = Math.sqrt(sum / n);
}

function tone(freqs, dur = .08, vol = .12) {
  if (!ac) return; let t = ac.currentTime + .01;
  for (const f of freqs) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02); t += dur; }
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- network ---------- */
function connect() {
  if (!S.joined) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/breaker/ws/${encodeURIComponent(S.code)}?name=${encodeURIComponent(S.name)}&cid=${encodeURIComponent(saved.cid)}`);
  ws.binaryType = 'arraybuffer'; S.ws = ws; net('wait', 'Connecting');
  ws.onopen = () => { S.retry = 0; S.lastPong = Date.now(); ws.send(JSON.stringify({ t: 'hello', muted: S.muted, mode: S.mode })); net('live', 'Live'); };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') return play(e.data);
    if (e.data === 'pong') { S.lastPong = Date.now(); return; }
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.t === 'you') S.me = m.slot;
    else if (m.t === 'roster') roster(m.people);
    else if (m.t === 'full') { S.joined = false; alert('That channel is full (' + m.max + ' people). Try another code.'); leave(); }
  };
  ws.onclose = () => { if (S.ws !== ws) return; S.ws = null; if (!S.joined) return; net('wait', 'Reconnecting'); setTimeout(connect, Math.min(6000, 400 * 2 ** S.retry++)); };
}
function drop() { const ws = S.ws; if (!ws) return; S.ws = null; ws.onclose = null; try { ws.close(); } catch (e) {} if (S.joined) { net('wait', 'Reconnecting'); connect(); } }
setInterval(() => {
  const ws = S.ws; if (!ws || ws.readyState !== 1) return;
  try { ws.send('ping'); } catch (e) {}
  if (Date.now() - S.lastPong > 25000) drop();       // silent dead socket (tunnel, chairlift, dead zone)
}, 8000);
addEventListener('online', () => { if (S.joined && (!S.ws || S.ws.readyState > 1)) drop(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.joined) return;
  if (ac) ac.resume().catch(() => {});
  if (!S.ws || S.ws.readyState !== 1) drop();
  if (S.wantWake) wakeOn();
});
function sendState() { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify({ t: 'state', muted: S.muted, mode: S.mode })); }
function net(cls, txt) { $('#net').className = 'net ' + cls; $('#netTxt').textContent = txt; }

/* ---------- people ---------- */
function roster(list) {
  const before = new Set(S.people.map(p => p.slot)), after = new Set(list.map(p => p.slot));
  if (S.people.length) {
    if (list.some(p => !before.has(p.slot) && p.slot !== S.me)) tone([880, 1320], .07, .08);
    else if (S.people.some(p => !after.has(p.slot))) tone([660, 440], .08, .08);
  }
  for (const k of [...S.senders.keys()]) if (!after.has(k)) S.senders.delete(k);
  S.people = list;
  const ul = $('#people'); ul.innerHTML = '';
  const others = list.filter(p => p.slot !== S.me);
  const mine = list.find(p => p.slot === S.me);
  for (const p of (mine ? [mine] : []).concat(others)) {
    const li = document.createElement('li'); li.dataset.slot = p.slot;
    const me = p.slot === S.me;
    li.innerHTML = '<span class="lv"></span><span class="n"></span><span class="tag mono"></span>';
    li.querySelector('.n').textContent = p.name;
    li.querySelector('.tag').textContent = (me ? 'You · ' : '') + (p.muted ? 'Muted' : p.mode === 'push' ? 'PTT' : 'Open');
    if (p.muted) li.classList.add('off');
    ul.appendChild(li);
  }
  if (!others.length) { const li = document.createElement('li'); li.className = 'empty mono'; li.textContent = 'Nobody else here yet. Send the invite.'; ul.appendChild(li); }
}

/* ---------- controls ---------- */
const big = $('#big');
function setMode(m, quiet) {
  S.mode = m; saved.mode = m; save();
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#windRow').hidden = m !== 'open';
  S.held = false; drawBig(); pushWorklet(); if (!quiet) sendState();
}
function setWind(w) { S.wind = w; saved.wind = w; save(); document.querySelectorAll('#windSeg button').forEach(b => b.classList.toggle('on', b.dataset.w === w)); pushWorklet(); }
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('#windSeg button').forEach(b => b.onclick = () => setWind(b.dataset.w));

function drawBig() {
  big.classList.toggle('push', S.mode === 'push');
  big.classList.toggle('held', S.mode === 'push' && S.held);
  big.classList.toggle('muted', S.mode === 'open' && S.muted);
  big.disabled = !S.mic;
  let t, s;
  if (!S.mic) { t = 'No mic'; s = 'Listening only · allow the mic and rejoin'; }
  else if (S.mode === 'open') { t = S.muted ? 'Muted' : 'Live'; s = S.muted ? 'Tap to unmute' : 'Tap to mute'; }
  else { t = S.held ? 'Talking' : 'Hold'; s = S.held ? 'Let go to stop' : 'Hold to talk · space bar'; }
  $('#bigT').textContent = t; $('#bigS').textContent = s;
  $('#pocketMe').textContent = !S.mic ? 'Listening only' : S.mode === 'open' ? (S.muted ? 'Muted' : 'Live') : 'Push to talk';
}
function toggleMute() { S.muted = !S.muted; tone(S.muted ? [700, 420] : [420, 700], .07); buzz(30); drawBig(); pushWorklet(); sendState(); }
function hold(on) {
  if (S.mode !== 'push' || !S.mic || S.held === on) return;
  S.held = on; if (on) { tone([1200, 1600], .05, .08); buzz(25); } else tone([1400, 900], .06, .08);
  drawBig(); pushWorklet();
}
big.addEventListener('pointerdown', e => {
  if (!S.mic) return; e.preventDefault();
  if (ac && ac.state !== 'running') ac.resume().catch(() => {});
  if (S.mode === 'open') toggleMute(); else { try { big.setPointerCapture(e.pointerId); } catch (_) {} hold(true); }
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => big.addEventListener(ev, () => hold(false)));
big.addEventListener('contextmenu', e => e.preventDefault());
big.addEventListener('click', e => e.preventDefault());
addEventListener('keydown', e => {
  if (!S.joined || e.target.closest('input')) return;
  if (e.code === 'Space') { e.preventDefault(); if (e.repeat) return; if (S.mode === 'push') hold(true); else toggleMute(); }
});
addEventListener('keyup', e => { if (e.code === 'Space') hold(false); });
addEventListener('blur', () => hold(false));

$('#share').onclick = async () => {
  const url = location.origin + '/breaker/?c=' + encodeURIComponent(S.code);
  try { if (navigator.share) { await navigator.share({ title: 'Breaker', text: 'Hop on channel ' + S.code, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); $('#share').textContent = 'Copied'; setTimeout(() => $('#share').textContent = 'Invite', 1500); } catch (e) { prompt('Invite link', url); }
};

async function wakeOn() {
  S.wantWake = true;
  try { if ('wakeLock' in navigator && !S.wake) { S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', () => { S.wake = null; drawWake(); }); } } catch (e) {}
  drawWake();
}
function wakeOff() { S.wantWake = false; try { S.wake && S.wake.release(); } catch (e) {} S.wake = null; drawWake(); }
function drawWake() { const b = $('#wake'); b.classList.toggle('on', !!S.wake); if (!('wakeLock' in navigator)) { b.textContent = 'No lock'; b.disabled = true; } }
$('#wake').onclick = () => S.wake ? wakeOff() : wakeOn();

$('#spk').onclick = () => { S.spk = S.spk === 1 ? 2 : S.spk === 2 ? .5 : 1; if (out) out.gain.value = 1.6 * S.spk; $('#spk').textContent = S.spk === 1 ? 'Speaker' : S.spk === 2 ? 'Loud' : 'Quiet'; $('#spk').classList.toggle('on', S.spk !== 1); };

const pocket = $('#pocket'); let lastTap = 0;
$('#pocketBtn').onclick = () => { pocket.hidden = false; wakeOn(); };
pocket.addEventListener('pointerdown', e => { e.preventDefault(); const t = performance.now(); if (t - lastTap < 400) pocket.hidden = true; lastTap = t; });

function leave() {
  S.joined = false; hold(false); const ws = S.ws; S.ws = null; if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
  wakeOff(); pocket.hidden = true; S.people = []; S.senders.clear(); net('', 'Offline');
  $('#room').hidden = true; $('#join').hidden = false;
}
$('#leave').onclick = leave;

/* ---------- live meters ---------- */
(function loop() {
  requestAnimationFrame(loop);
  if (!S.joined) return;
  const now = performance.now();
  const sendingNow = S.mic && myOpen;
  $('#ring').style.transform = `translate(-50%,-50%) scale(${sendingNow ? .35 + Math.min(1.4, myLevel * 9) : .2})`;
  const talking = [];
  document.querySelectorAll('#people li[data-slot]').forEach(li => {
    const slot = +li.dataset.slot; let on, lvl;
    if (slot === S.me) { on = sendingNow; lvl = myLevel; }
    else { const p = S.senders.get(slot); on = !!p && now - p.last < 300; lvl = p ? p.lvl : 0; }
    li.classList.toggle('talk', on);
    li.querySelector('.lv').style.transform = `scale(${on ? 1 + Math.min(1.2, lvl * 8) : 1})`;
    if (on && slot !== S.me) talking.push(li.querySelector('.n').textContent);
  });
  if (!pocket.hidden) $('#pocketWho').textContent = talking.join(' · ');
})();
</script>
</body>
