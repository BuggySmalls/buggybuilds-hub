<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grind · BuGGy Builds</title>
<meta name="description" content="Weight, runs, lifts and food, tracked over time.">
<meta property="og:title" content="Grind · BuGGy Builds">
<meta property="og:description" content="Weight, runs, lifts and food, tracked over time.">
<meta name="theme-color" content="#FF3B1F">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--paper:#F1EFEA; --ink:#111111; --muted:#77736B; --line:#111111; --red:#FF3B1F; --soft:#E4E1DA; --card:#E9E6DF; color-scheme:light}
@media (prefers-color-scheme:dark){ :root{--paper:#121211; --ink:#F1EFEA; --muted:#8F8A80; --line:#F1EFEA; --soft:#262523; --card:#1B1A19; color-scheme:dark} }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font:500 16px/1.4 'Inter Tight', system-ui, sans-serif; min-height:100vh; overflow-x:hidden}
::selection{background:var(--red); color:#fff}
.wrap{max-width:1240px; margin:0 auto; padding:20px 20px calc(40px + env(safe-area-inset-bottom))}
.mono{font:500 12px/1.5 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.04em}
.top{position:sticky; top:0; z-index:5; background:var(--paper); display:grid; grid-template-columns:repeat(4,1fr); gap:20px; padding:14px 0; border-bottom:2px solid var(--line)}
.top a,.top button{color:inherit; text-decoration:none; background:none; border:0; padding:0; font:inherit; cursor:pointer; text-transform:inherit; letter-spacing:inherit}
.top a:hover,.top button:hover{color:var(--red)}
.top .v{text-align:right}
.brand{text-transform:none}
h1{font:900 clamp(64px,17vw,250px)/.82 'Inter Tight', sans-serif; letter-spacing:-.065em; margin:26px 0 22px; margin-left:-.05em}
h1 i{font-style:normal; color:var(--red)}
h2{font:900 clamp(34px,5vw,64px)/.9 'Inter Tight'; letter-spacing:-.045em; margin:0 0 14px}
h3{font:700 22px/1.05 'Inter Tight'; letter-spacing:-.02em; margin:0 0 10px}

.tabs{position:sticky; top:47px; z-index:4; background:var(--paper); display:grid; grid-template-columns:repeat(6,1fr); border-top:2px solid var(--line); border-bottom:2px solid var(--line)}
.tabs button{font:500 12px/1 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.04em; background:none; border:0; border-left:1px solid var(--line); color:var(--ink); padding:15px 2px; cursor:pointer}
.tabs button:first-child{border-left:0}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.tabs button:hover:not([aria-selected="true"]){color:var(--red)}
.pane{padding:26px 0 0}
.pane[hidden]{display:none}

.grid{display:grid; gap:0; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--line)}
.stat{padding:14px 14px 16px 0; border-bottom:1px solid var(--soft); min-width:0}
.stat + .stat{padding-left:14px; border-left:1px solid var(--soft)}
.stat .lab{color:var(--muted)}
.stat b{display:block; font:900 clamp(30px,4vw,48px)/.95 'Inter Tight'; letter-spacing:-.04em; margin:6px 0 4px; overflow-wrap:anywhere}
.stat b small{font:700 .45em 'Inter Tight'; letter-spacing:-.01em; color:var(--muted); margin-left:3px}
.stat .sub{color:var(--muted); font-size:14px}
.up{color:var(--red)}
.cols{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:28px; margin-top:28px}
.box{border-top:2px solid var(--line); padding-top:14px; min-width:0}
.box + .box{margin-top:28px}
.cols .box + .box{margin-top:0}

form.entry{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:14px}
label.f{display:flex; flex-direction:column; gap:5px; min-width:0}
label.f[hidden]{display:none}
label.f span{font:500 11px/1 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
input,select,textarea{font:500 16px/1.2 'Inter Tight', system-ui, sans-serif; color:var(--ink); background:transparent; border:0; border-bottom:2px solid var(--ink); border-radius:0; padding:9px 2px; width:100%; min-width:0}
select{appearance:none; -webkit-appearance:none; padding-right:20px; background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%); background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%; background-size:5px 5px; background-repeat:no-repeat}
select option{background:var(--paper); color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none; border-bottom-color:var(--red)}
.w90{width:90px} .w110{width:110px} .w140{width:140px} .grow{flex:1 1 160px}
.btn{font:500 13px/1 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.04em; padding:13px 15px; border:2px solid var(--ink); background:transparent; color:var(--ink); border-radius:0; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap}
.btn:hover,.btn:focus-visible{background:var(--ink); color:var(--paper); outline:none}
.btn.primary{background:var(--ink); color:var(--paper)}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--red); border-color:var(--red); color:#fff}
.btn.sm{padding:8px 10px; font-size:11px}
.btn.ghost{border-color:transparent}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.chip{font:500 12px/1 'JetBrains Mono', monospace; text-transform:uppercase; letter-spacing:.03em; padding:9px 11px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; border-radius:999px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.chip:hover{border-color:var(--red)}

.chart{width:100%; display:block; margin:4px 0 6px}
.chart text{font:500 11px 'JetBrains Mono', monospace; fill:var(--muted)}
.chart .grid line{stroke:var(--soft); stroke-width:1}
.legend{display:flex; gap:16px; flex-wrap:wrap; color:var(--muted)}
.legend i{display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:6px}
.empty{padding:22px 0; color:var(--muted)}

.list{list-style:none; margin:0; padding:0}
.list li{display:grid; grid-template-columns:96px minmax(0,1fr) auto 30px; gap:12px; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--soft)}
.list li .d{font:500 12px 'JetBrains Mono', monospace; color:var(--muted); text-transform:uppercase}
.list li .m{min-width:0; overflow-wrap:anywhere}
.list li .m small{display:block; color:var(--muted); font-size:14px}
.list li .r{font:700 20px/1 'Inter Tight'; letter-spacing:-.02em; text-align:right; white-space:nowrap}
.x{background:none; border:0; color:var(--muted); font:700 18px/1 'Inter Tight'; cursor:pointer; padding:2px 4px}
.x:hover{color:var(--red)}
.pr{display:inline-block; font:500 10px/1 'JetBrains Mono', monospace; background:var(--red); color:#fff; padding:3px 5px; margin-left:6px; vertical-align:2px; letter-spacing:.04em}

.sets{display:flex; flex-direction:column; gap:8px; width:100%}
.set{display:grid; grid-template-columns:44px 90px 18px 100px 30px; gap:8px; align-items:end}
.set .n{font:500 12px 'JetBrains Mono', monospace; color:var(--muted); padding-bottom:12px}
.set .by{color:var(--muted); padding-bottom:10px; text-align:center}

.day{display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:2px solid var(--line); border-bottom:1px solid var(--line); padding:10px 0; margin-bottom:18px}
.day b{font:700 clamp(22px,3vw,30px)/1 'Inter Tight'; letter-spacing:-.02em}
.ring{display:grid; grid-template-columns:150px minmax(0,1fr); gap:22px; align-items:center; margin-bottom:22px}
.ring svg{width:150px; height:150px; display:block}
.bar{height:10px; background:var(--soft); position:relative; margin:6px 0 14px}
.bar i{position:absolute; left:0; top:0; bottom:0; background:var(--ink)}
.bar i.over{background:var(--red)}
.meal{margin-bottom:18px}
.meal h3{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:6px; margin:0}
.meal h3 span{font:500 12px 'JetBrains Mono', monospace; color:var(--muted)}
.meal .list li{grid-template-columns:minmax(0,1fr) auto 30px}
.quick{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0}
.quick button{font:500 13px/1.1 'Inter Tight'; padding:8px 10px; border:1px solid var(--soft); background:var(--card); color:var(--ink); cursor:pointer; text-align:left}
.quick button small{display:block; font:500 10px 'JetBrains Mono', monospace; color:var(--muted); margin-top:2px}
.quick button:hover{border-color:var(--red)}

.plan{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; border-top:2px solid var(--line)}
.card{padding:16px 16px 18px 0; min-width:0; display:flex; flex-direction:column; gap:10px}
.card + .card{padding-left:16px; border-left:1px solid var(--line)}
.card .slot{color:var(--red)}
.card h3{font:900 clamp(26px,3vw,38px)/.92 'Inter Tight'; letter-spacing:-.04em; margin:0}
.card .mac{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; border-top:1px solid var(--soft); border-bottom:1px solid var(--soft); padding:8px 0}
.card .mac b{display:block; font:700 20px/1 'Inter Tight'; letter-spacing:-.02em}
.card .mac span{font:500 10px 'JetBrains Mono', monospace; color:var(--muted); text-transform:uppercase}
.card ul{margin:0; padding-left:18px; color:var(--ink)} .card ul li{padding:1px 0}
.card .how{color:var(--muted); font-size:15px; margin:0}
.card .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
.totals{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:2px solid var(--line); border-bottom:1px solid var(--line); margin-top:0}
.totals div{padding:12px 12px 12px 0} .totals div + div{padding-left:12px; border-left:1px solid var(--soft)}
.totals b{display:block; font:900 32px/1 'Inter Tight'; letter-spacing:-.04em}
.grocery{columns:3 200px; column-gap:24px; margin:0; padding:0; list-style:none}
.grocery li{break-inside:avoid; padding:7px 0; border-bottom:1px solid var(--soft); display:flex; gap:10px; align-items:baseline}
.grocery li input{width:auto; flex:0 0 auto; accent-color:var(--red)}
.grocery li.got span{text-decoration:line-through; color:var(--muted)}
.note{color:var(--muted); font-size:14px; margin:10px 0 0}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:var(--ink); color:var(--paper); padding:12px 16px; opacity:0; transition:.25s; pointer-events:none; z-index:20; max-width:calc(100vw - 40px)}
.toast.on{opacity:1; transform:translate(-50%,0)}

dialog{border:2px solid var(--ink); background:var(--paper); color:var(--ink); padding:22px; max-width:520px; width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px}
dialog .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}

.foot{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; padding-top:18px; margin-top:48px; color:var(--muted); border-top:1px solid var(--line)}
.foot a{color:inherit} .foot span:last-child{text-align:right}

@media (max-width:760px){
  .top{grid-template-columns:1fr 1fr} .top span:nth-child(2),.top span:nth-child(3){display:none}
  .tabs{top:47px} .tabs button{font-size:10.5px; padding:14px 0; letter-spacing:0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(odd){padding-left:0; border-left:0}
  .stat:nth-child(even){padding-left:14px; border-left:1px solid var(--soft)}
  .cols{grid-template-columns:minmax(0,1fr)}
  .cols .box + .box{margin-top:28px}
  .list li{grid-template-columns:72px minmax(0,1fr) auto 26px; gap:8px}
  .ring{grid-template-columns:110px minmax(0,1fr); gap:16px} .ring svg{width:110px; height:110px}
  .plan{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px 0} .card + .card{padding-left:0; border-left:0; border-top:1px solid var(--line)}
  .totals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .totals div:nth-child(3){padding-left:0; border-left:0}
  .set{grid-template-columns:34px minmax(0,1fr) 14px minmax(0,1fr) 26px}
  .w140{width:120px}
  .foot{grid-template-columns:1fr 1fr} .foot span:nth-child(2),.foot span:nth-child(3){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top mono"><span><a class="brand" href="/">BuGGy Builds</a></span><span>04 · Grind</span><span id="streakTop"></span><span class="v"><button id="openSetup">Setup</button> · <a href="/">Index</a></span></header>
  <h1>Grind<i>.</i></h1>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="weight">Weight</button>
    <button role="tab" data-tab="runs">Runs</button>
    <button role="tab" data-tab="lift">Lift</button>
    <button role="tab" data-tab="food">Food</button>
    <button role="tab" data-tab="prep">Prep</button>
  </nav>

  <section class="pane" id="p-today"></section>
  <section class="pane" id="p-weight" hidden></section>
  <section class="pane" id="p-runs" hidden></section>
  <section class="pane" id="p-lift" hidden></section>
  <section class="pane" id="p-food" hidden></section>
  <section class="pane" id="p-prep" hidden></section>

  <footer class="foot mono"><span>© <span id="yr">2026</span> <span class="brand">BuGGy Builds</span></span><span></span><span></span><span><a href="/">Index</a></span></footer>
</div>

<dialog id="setup">
  <h2>Setup<i style="font-style:normal;color:var(--red)">.</i></h2>
  <div class="row2">
    <label class="f"><span>Calorie goal / day</span><input id="sCal" type="number" inputmode="numeric" min="0" step="50"></label>
    <label class="f"><span>Protein goal (g)</span><input id="sPro" type="number" inputmode="numeric" min="0" step="5"></label>
  </div>
  <div class="row2">
    <label class="f"><span>Goal weight (lb)</span><input id="sGoal" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Optional"></label>
    <label class="f"><span>Mile goal (m:ss)</span><input id="sMile" type="text" inputmode="numeric" placeholder="Optional, e.g. 6:30"></label>
  </div>
  <p class="note">Everything you log is saved in this browser on this phone only. Nothing is sent anywhere. Back it up now and then, and use Import to move it to another device.</p>
  <div class="acts">
    <button class="btn primary" id="sSave">Save</button>
    <button class="btn" id="sExport">Back up (export)</button>
    <label class="btn" style="position:relative">Import<input id="sImport" type="file" accept="application/json,.json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    <button class="btn ghost" id="sClose">Close</button>
  </div>
  <div class="acts"><button class="btn sm ghost" id="sWipe" style="color:var(--muted)">Erase everything</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
/* Grind: weight, runs, lifts and food over time. Everything lives in localStorage on this device. */
const KEY = 'buggybuilds.grind.v1';
const TZ = 'America/New_York';
const MI_5K = 3.10686;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const t = d => new Date(d + 'T12:00:00Z').getTime();
const addDays = (d, n) => new Date(t(d) + n * 864e5).toISOString().slice(0, 10);
const fmtD = (d, o = { month: 'short', day: 'numeric' }) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const r1 = n => Math.round(n * 10) / 10;
const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(r1(n));
const clock = s => { if (s == null || !isFinite(s)) return '—'; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const parseClock = v => { v = String(v || '').trim(); if (!v) return null; const p = v.split(':').map(Number); if (p.some(n => !isFinite(n) || n < 0)) return null; if (p.length === 1) return p[0] * 60; if (p.length === 2) return p[0] * 60 + p[1]; if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2]; return null; };

/* ---------- storage ---------- */
const BLANK = () => ({ v: 1, settings: { cal: 2400, pro: 170, goal: null, mile: null }, weights: [], runs: [], lifts: [], food: [], myFoods: [], prep: null });
let S;
function load() { try { S = Object.assign(BLANK(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch (e) { S = BLANK(); } S.settings = Object.assign(BLANK().settings, S.settings || {}); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save on this browser'); } }
load();

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2200); }
const byDate = (a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0;

/* ---------- chart ---------- */
// series: [{pts:[[dateISO, y]], color, dots, dash, width}] · opts: {fmt, invert, goal}
function chart(series, opts = {}) {
  const W = opts.wide && innerWidth > 760 ? 1160 : 640, H = 230, L = 50, R = 14, T = 14, B = 28;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return '';
  let x0 = Math.min(...all.map(p => t(p[0]))), x1 = Math.max(...all.map(p => t(p[0])));
  if (x1 - x0 < 6 * 864e5) { const mid = (x0 + x1) / 2; x0 = mid - 3 * 864e5; x1 = mid + 3 * 864e5; }
  const ys = all.map(p => p[1]).concat(opts.goal != null ? [opts.goal] : []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * .12 || Math.max(1, Math.abs(y1) * .03);
  y0 -= pad; y1 += pad;
  const X = d => L + (t(d) - x0) / (x1 - x0) * (W - L - R);
  const Y = v => { const f = (v - y0) / (y1 - y0); return opts.invert ? T + f * (H - T - B) : H - B - f * (H - T - B); };
  const fmt = opts.fmt || (v => r1(v));
  let g = '<g class="grid">';
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${esc(fmt(v))}</text>`; }
  for (let i = 0; i <= 3; i++) { const ms = x0 + (x1 - x0) * i / 3, d = new Date(ms).toISOString().slice(0, 10); g += `<text x="${X(d)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${fmtD(d)}</text>`; }
  g += '</g>';
  if (opts.goal != null) { const y = Y(opts.goal); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--red)" stroke-dasharray="4 5" stroke-width="1.5"/><text x="${W - R}" y="${y - 6}" text-anchor="end" style="fill:var(--red)">Goal ${esc(fmt(opts.goal))}</text>`; }
  for (const s of series) {
    const pts = s.pts.slice().sort((a, b) => t(a[0]) - t(b[0]));
    if (s.line !== false && pts.length > 1) g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="' + s.dash + '"' : ''} points="${pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>`;
    if (s.dots) for (const p of pts) g += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r || 3.5}" fill="${s.fill || 'var(--paper)'}" stroke="${s.color}" stroke-width="2"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function bars(days, vals, goal) {
  const W = innerWidth > 760 ? 1160 : 640, H = 200, L = 50, R = 14, T = 14, B = 28, n = days.length;
  const top = Math.max(goal || 0, ...vals) * 1.1 || 100;
  const Y = v => H - B - v / top * (H - T - B), bw = (W - L - R) / n;
  let g = '<g class="grid">';
  for (let i = 0; i <= 3; i++) { const v = top * i / 3, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  g += '</g>';
  days.forEach((d, i) => {
    const v = vals[i], x = L + i * bw + bw * .18, w = bw * .64;
    if (v > 0) g += `<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - B - Y(v)).toFixed(1)}" fill="${goal && v > goal ? 'var(--red)' : 'var(--ink)'}"/>`;
    if (i % Math.ceil(n / 7) === 0 || i === n - 1) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${fmtD(d, { weekday: 'narrow' })}${fmtD(d, { day: 'numeric' })}</text>`;
  });
  if (goal) { const y = Y(goal); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--red)" stroke-dasharray="4 5" stroke-width="1.5"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ---------- derived ---------- */
function weightsSorted() { return S.weights.slice().sort(byDate); }
function avg7(list, d) { const xs = list.filter(w => w.d <= d && w.d > addDays(d, -7)).map(w => w.w); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }
function weightAt(list, d) { let best = null; for (const w of list) if (w.d <= d) best = w; return best; }
const runPace = r => r.sec / r.dist;
function runPR(kind) { const xs = S.runs.filter(r => r.kind === kind); return xs.length ? xs.reduce((a, b) => (b.sec < a.sec ? b : a)) : null; }
const e1rm = (w, r) => (!w ? 0 : r <= 1 ? w : w * (1 + r / 30));
function liftBest(l) { let b = { e: 0, w: 0, r: 0 }; for (const s of l.sets) { const e = e1rm(s.w, s.r); if (e > b.e || (!s.w && !b.e && s.r > b.r)) b = { e, w: s.w, r: s.r }; } return b; }
const liftVol = l => l.sets.reduce((a, s) => a + (s.w || 0) * s.r, 0);
const liftReps = l => l.sets.reduce((a, s) => a + s.r, 0);
function foodOn(d) { return S.food.filter(f => f.d === d); }
const sum = (xs, k) => xs.reduce((a, x) => a + (+x[k] || 0), 0);
function loggedDays() { const set = new Set(); for (const k of ['weights', 'runs', 'lifts', 'food']) for (const x of S[k]) set.add(x.d); return set; }
function streak() { const set = loggedDays(); let d = todayISO(), n = 0; if (!set.has(d)) d = addDays(d, -1); while (set.has(d)) { n++; d = addDays(d, -1); } return n; }

/* ---------- tabs ---------- */
const PANES = { today: renderToday, weight: renderWeight, runs: renderRuns, lift: renderLift, food: renderFood, prep: renderPrep };
let tab = (location.hash.slice(1) in PANES) ? location.hash.slice(1) : 'today';
function show(name) {
  tab = name;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  for (const k in PANES) document.getElementById('p-' + k).hidden = k !== name;
  PANES[name]();
  if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
  const s = streak(); document.getElementById('streakTop').textContent = s ? s + ' day streak' : '';
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) { show(b.dataset.tab); scrollTo({ top: Math.min(scrollY, document.querySelector('.tabs').offsetTop - 47) }); } });
function rerender() { PANES[tab](); const s = streak(); document.getElementById('streakTop').textContent = s ? s + ' day streak' : ''; }

/* ---------- LIFT ---------- */

let liftEx = null, liftDraft = [{ r: '', w: '' }];
function exList() { const used = [...new Set(S.lifts.map(l => l.ex))]; return [...new Set([...used, ...EXERCISES])]; }
function renderLift() {
  const d = todayISO(), lifts = S.lifts.slice().sort(byDate), exs = exList();
  if (!liftEx) liftEx = lifts.length ? lifts[lifts.length - 1].ex : 'Bench Press';

      <button class="btn primary">Save workout</button>

      <div class="stat"><div class="lab mono">Last time</div><b>${prev ? prev.sets.length + '<small>' + (prev.sets.length === 1 ? 'set' : 'sets') + '</small>' : '—'}</b><div class="sub">${prev ? prev.sets.map(s => s.r + (s.w ? '×' + s.w : '')).join(', ') : 'No sessions yet'}</div></div>
      <div class="stat"><div class="lab mono">Sessions</div><b>${mine.length}</b><div class="sub">${esc(liftEx)}</div></div>
      <div class="stat"><div class="lab mono">${bw ? 'Total reps, last' : 'Volume, last'}</div><b>${prev ? (bw ? liftReps(prev) : Math.round(liftVol(prev)).toLocaleString()) + (bw ? '' : '<small>lb</small>') : '—'}</b><div class="sub">${bw ? 'Reps across all sets' : 'Reps × weight, all sets'}</div></div>
    </div>
    <div class="cols">

      <div class="box"><h3>Bests</h3>${Object.keys(bests).length ? '<ul class="list">' + Object.entries(bests).sort((a, b) => b[1].e - a[1].e).map(([k, b]) => `<li style="grid-template-columns:minmax(0,1fr) auto"><span class="m"><a href="#lift" data-pick="${esc(k)}" style="color:inherit">${esc(k)}</a><small>${b.e ? b.r + ' × ' + b.w + ' lb · ' : ''}${fmtD(b.d)}</small></span><span class="r">${b.e ? Math.round(b.e) + ' <span class="mono" style="color:var(--muted)">1RM</span>' : b.r + ' <span class="mono" style="color:var(--muted)">reps</span>'}</span></li>`).join('') + '</ul><p class="note">Est. 1-rep max uses the Epley formula: weight × (1 + reps ÷ 30).</p>' : '<div class="empty">Your best lift for each exercise lands here.</div>'}</div>

    </div>`;
}

/* ---------- FOOD ---------- */

  } else if (kind === 'lift') {
    let ex = f.querySelector('#liftEx').value; if (ex === '__new') return;
    const sets = liftDraft.map((s, i) => { const prev = S.lifts.filter(l => l.ex === ex).sort(byDate).pop(); const r = parseInt(s.r || ''), w = s.w === '' ? NaN : parseFloat(s.w); return { r, w: isNaN(w) ? (prev && prev.sets[i] ? prev.sets[i].w : NaN) : w }; }).filter(s => s.r > 0);
    if (!sets.length) return toast('Add at least one set with reps');
    if (sets.some(s => isNaN(s.w))) return toast('Add a weight for each set (0 for bodyweight)');
    const old = S.lifts.filter(l => l.ex === ex).reduce((a, l) => Math.max(a, liftBest(l).e), 0);
    const l = { id: uid(), d: v.d, ex, sets }; S.lifts.push(l); liftEx = ex; liftDraft = [{ r: '', w: '' }]; save();
    toast(old && liftBest(l).e > old ? 'New best! Est. 1RM ' + Math.round(liftBest(l).e) + ' lb' : 'Workout saved'); rerender();
  } else if (kind === 'food') {
    const name = (v.name || '').trim(), cal = parseInt(v.cal), p = parseInt(v.p) || 0;
    if (!name || !(cal >= 0)) return toast('Add a food and calories');
    addFood(name, cal, p);
  }
});
function addFood(name, cal, p, meal) {
  S.food.push({ id: uid(), d: foodDay, meal: meal || foodMeal || guessMeal(), name, cal, p });
  if (!FOODS.some(f => f[0].toLowerCase() === name.toLowerCase())) { S.myFoods = S.myFoods.filter(f => f.name.toLowerCase() !== name.toLowerCase()); S.myFoods.unshift({ name, cal, p }); S.myFoods = S.myFoods.slice(0, 60); }
  save(); toast(name + ' added'); rerender();
}
document.addEventListener('input', e => {
  const i = e.target;
  if (i.dataset.set != null) { liftDraft[+i.dataset.set][i.dataset.k] = i.value; return; }
  if (i.name === 'name' && i.closest('form[data-form="food"]')) {
    const all = [...S.myFoods.map(f => [f.name, f.cal, f.p]), ...FOODS], hit = all.find(f => f[0].toLowerCase() === i.value.trim().toLowerCase());
    if (hit) { const fm = i.form; fm.cal.value = hit[1]; fm.p.value = hit[2]; }
  }
});
document.addEventListener('change', e => {
  const i = e.target;
  if (i.id === 'liftEx') {
    if (i.value === '__new') { const n = (prompt('Exercise name') || '').trim().slice(0, 40); if (n) { if (!EXERCISES.includes(n)) EXERCISES.push(n); liftEx = n; } renderLift(); return; }
    liftEx = i.value; liftDraft = [{ r: '', w: '' }]; renderLift();
  }
  if (i.dataset.got != null) { const P = prepState(), k = i.dataset.got; P.got = i.checked ? [...new Set([...P.got, k])] : P.got.filter(x => x !== k); save(); i.closest('li').classList.toggle('got', i.checked); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button, a[data-pick]'); if (!b) return;
  if (b.dataset.go) return show(b.dataset.go);
  if (b.dataset.del) { const k = b.dataset.del, id = b.dataset.id; S[k] = S[k].filter(x => k === 'weights' ? x.d !== id : x.id !== id); save(); toast('Deleted'); return rerender(); }
  if (b.dataset.wrange != null) { wRange = +b.dataset.wrange; return renderWeight(); }
  if (b.dataset.kind) { runKindSel = b.dataset.kind; return renderRuns(); }
  if (b.id === 'addSet') { const last = liftDraft[liftDraft.length - 1] || { r: '', w: '' }; liftDraft.push({ r: last.r, w: last.w }); return renderLift(); }
  if (b.dataset.rmset != null) { liftDraft.splice(+b.dataset.rmset, 1); return renderLift(); }
  if (b.id === 'copyLast') { const prev = S.lifts.filter(l => l.ex === liftEx).sort(byDate).pop(); if (prev) liftDraft = prev.sets.map(s => ({ r: String(s.r), w: String(s.w) })); return renderLift(); }
  if (b.dataset.pick) { e.preventDefault(); liftEx = b.dataset.pick; liftDraft = [{ r: '', w: '' }]; renderLift(); return scrollTo({ top: 0, behavior: 'smooth' }); }
  if (b.dataset.fday) { foodDay = addDays(foodDay, +b.dataset.fday); if (foodDay > todayISO()) foodDay = todayISO(); return renderFood(); }
  if (b.dataset.meal) { foodMeal = b.dataset.meal; document.querySelectorAll('[data-meal]').forEach(x => x.setAttribute('aria-pressed', x.dataset.meal === foodMeal)); return; }
  if (b.dataset.quick) { const [n, c, p] = JSON.parse(b.dataset.quick); return addFood(n, c, p || 0); }
  if (b.dataset.pdays) { prepState().days = +b.dataset.pdays; prepState().got = []; save(); return renderPrep(); }
  if (b.dataset.ptag) { const P = prepState(), t = b.dataset.ptag; P.off = P.off.includes(t) ? P.off.filter(x => x !== t) : [...P.off, t]; if (TAGS.every(([x]) => P.off.includes(x))) P.off = P.off.filter(x => x !== t); shuffle(); return renderPrep(); }
  if (b.dataset.pmin != null) { prepState().maxMin = +b.dataset.pmin; shuffle(); return renderPrep(); }
  if (b.id === 'reshuffle') { shuffle(); return renderPrep(); }
  if (b.dataset.swap) { shuffle(b.dataset.swap); return renderPrep(); }
  if (b.dataset.logmeal) { const P = prepState(), slot = b.dataset.logmeal, r = R(P[slot]), k = portions(R(P.b), R(P.l), R(P.dn)); const keep = foodDay; foodDay = todayISO(); addFood(r.name, Math.round(r.cal * k), Math.round(r.p * k), slot === 'b' ? 'Breakfast' : slot === 'l' ? 'Lunch' : 'Dinner'); foodDay = keep; return; }
  if (b.id === 'copyList') { const P = prepState(); const lines = [...document.querySelectorAll('.grocery li')].filter(li => !li.classList.contains('got')).map(li => '• ' + li.textContent.trim()); const txt = 'Meal prep · ' + P.days + ' days\n' + lines.join('\n'); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('List copied'), () => toast('Could not copy on this browser')); return; }
});

/* ---------- setup ---------- */
const dlg = document.getElementById('setup');
document.getElementById('openSetup').onclick = () => {
  const s = S.settings; document.getElementById('sCal').value = s.cal; document.getElementById('sPro').value = s.pro; document.getElementById('sGoal').value = s.goal || ''; document.getElementById('sMile').value = s.mile ? clock(s.mile) : '';
  dlg.showModal();
};
document.getElementById('sClose').onclick = () => dlg.close();
document.getElementById('sSave').onclick = () => {
  const cal = parseInt(document.getElementById('sCal').value), pro = parseInt(document.getElementById('sPro').value), goal = parseFloat(document.getElementById('sGoal').value), mile = parseClock(document.getElementById('sMile').value);
  S.settings = { cal: cal > 0 ? cal : S.settings.cal, pro: pro > 0 ? pro : S.settings.pro, goal: goal > 0 ? goal : null, mile: mile || null };
  save(); dlg.close(); toast('Saved'); rerender();
};
document.getElementById('sExport').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'grind-backup-' + todayISO() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup downloaded');
};
document.getElementById('sImport').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try { const data = JSON.parse(await file.text()); if (!data || !Array.isArray(data.weights)) throw 0; if (!confirm('Replace what is on this device with the backup?')) return; localStorage.setItem(KEY, JSON.stringify(data)); load(); dlg.close(); toast('Backup loaded'); rerender(); }
  catch (err) { toast('That file is not a Grind backup'); }
  e.target.value = '';
};
document.getElementById('sWipe').onclick = () => { if (confirm('Erase every weigh-in, run, lift and meal on this device? This cannot be undone.')) { localStorage.removeItem(KEY); load(); dlg.close(); toast('Erased'); rerender(); } };

try { document.getElementById('yr').textContent = new Date().getFullYear(); } catch (e) {}
show(tab);
</script>
