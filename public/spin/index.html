<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Spin · BuGGy Builds</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* The Spin: a two-team golf match where every hole's format comes off a wheel.
   One Club holes spin a second wheel for the club. The round is saved on this device. */
:root{--paper:#F1EFEA; --ink:#111; --muted:#77736B; --line:#111; --red:#FF3B1F; --soft:#E4E1DA; --card:#F8F7F3; color-scheme:light}
@media (prefers-color-scheme:dark){ :root{--paper:#121211; --ink:#F1EFEA; --muted:#8F8A80; --line:#F1EFEA; --soft:#262523; --card:#1B1A19; color-scheme:dark} }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper); color:var(--ink); font:500 16px/1.4 'Inter Tight',system-ui,sans-serif; min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent}
.wrap{max-width:820px; margin:0 auto; padding:16px 18px 60px}
.mono{font:500 12px/1.5 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.04em}
.top{display:flex; justify-content:space-between; gap:12px; padding:10px 0 12px; border-bottom:2px solid var(--line)}
.top a{color:inherit; text-decoration:none} .top a:hover{color:var(--red)}
h1{font:900 clamp(64px,19vw,150px)/.82 'Inter Tight'; letter-spacing:-.065em; margin:22px 0 14px; margin-left:-.04em}
h1 i{font-style:normal; color:var(--red)}
h2{font:700 clamp(28px,6vw,40px)/.95 'Inter Tight'; letter-spacing:-.035em; margin:0 0 12px}
.sec{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); color:var(--muted); margin-top:26px}
.sec b{color:var(--ink); font-weight:500}
button{font:inherit; color:inherit; cursor:pointer}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:14px 20px; font:700 18px 'Inter Tight'; letter-spacing:-.01em; border-radius:0; min-height:52px}
.btn:hover{background:var(--red); border-color:var(--red); color:#fff}
.btn.ghost{background:transparent; color:var(--ink)} .btn.ghost:hover{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn.red{background:var(--red); border-color:var(--red); color:#fff} .btn.red:hover{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.btn:disabled{opacity:.35; pointer-events:none}
.btn.small{padding:8px 12px; font-size:14px; min-height:40px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
label.f{display:block; margin-bottom:12px} label.f span{display:block; color:var(--muted); margin-bottom:4px}
input[type=text]{width:100%; font:600 18px 'Inter Tight'; color:var(--ink); background:var(--card); border:2px solid var(--ink); padding:10px 12px; border-radius:0}
input[type=text]:focus{outline:none; border-color:var(--red)}
.team h3{margin:0 0 10px; font:900 22px 'Inter Tight'; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.sw{width:14px; height:14px; display:inline-block}
.sw.a{background:var(--red)} .sw.b{background:var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--ink); background:transparent; padding:9px 12px; font:700 15px 'Inter Tight'; min-height:42px}
.chip[aria-pressed=true]{background:var(--ink); color:var(--paper)}
.seg{display:inline-flex; border:2px solid var(--ink)}
.seg button{border:0; background:transparent; padding:10px 18px; font:700 16px 'Inter Tight'; min-height:44px}
.seg button + button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink); color:var(--paper)}
.hint{color:var(--muted); font-size:14px; margin:6px 0 0}

/* match bar */
.bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:14px 0; border-bottom:2px solid var(--line)}
.bar .side{font:900 clamp(20px,5vw,30px)/1 'Inter Tight'; letter-spacing:-.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .side.b{text-align:right}
.bar .side small{display:block; white-space:normal; font:500 12px 'JetBrains Mono',monospace; color:var(--muted); letter-spacing:.04em; margin-top:6px; text-transform:uppercase}
.bar .mid{text-align:center}
.bar .st{font:900 clamp(26px,7vw,40px)/1 'Inter Tight'; letter-spacing:-.04em}
.bar .st.a{color:var(--red)}
.bar .thru{color:var(--muted); margin-top:4px}

/* hole */
.hole{padding-top:18px}
.holehead{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.holehead .num{font:900 clamp(56px,15vw,96px)/.85 'Inter Tight'; letter-spacing:-.06em}
.holehead .num small{font-size:.32em; letter-spacing:-.02em; color:var(--muted); margin-left:6px}
.wheels{display:grid; grid-template-columns:1fr; gap:18px; margin:18px 0 10px; justify-items:center}
.wheels.two{grid-template-columns:1fr 1fr}
.wheelbox{width:100%; max-width:360px; text-align:center}
.wheelbox .lbl{color:var(--muted); margin-bottom:6px}
.wheel{position:relative; width:100%; aspect-ratio:1; overflow:hidden; border-radius:50%; padding-top:0} .wheelbox .wheelwrap{position:relative; cursor:pointer}
.wheel svg.w{pointer-events:none; width:100%; height:100%; display:block; transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.wheelbox .ptr{position:absolute; left:50%; top:-8px; transform:translateX(-50%); width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:26px solid var(--red); z-index:2; filter:drop-shadow(0 2px 0 var(--paper))}
.wheel .hub{position:absolute; inset:0; margin:auto; width:22%; height:22%; border-radius:50%; background:var(--paper); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font:900 13px 'Inter Tight'; letter-spacing:-.01em; z-index:1}
.result{border:2px solid var(--ink); padding:16px; margin:8px 0 16px; background:var(--card)}
.result .fmt{font:900 clamp(34px,9vw,54px)/.95 'Inter Tight'; letter-spacing:-.045em}
.result .fmt i{font-style:normal; color:var(--red)}
.result p{margin:8px 0 0; color:var(--muted); font-size:17px; max-width:52ch}
.result p b{color:var(--ink); font-weight:700}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.92); opacity:0}}

.scores{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px}
.sc{border:2px solid var(--ink); padding:12px; text-align:center}
.sc .who{font:900 18px 'Inter Tight'; display:flex; align-items:center; justify-content:center; gap:8px; overflow:hidden; white-space:nowrap}
.step{display:grid; grid-template-columns:52px 1fr 52px; align-items:center; margin-top:10px}
.step button{height:52px; border:2px solid var(--ink); background:transparent; font:700 26px/1 'Inter Tight'}
.step button:active{background:var(--ink); color:var(--paper)}
.step output{font:900 44px/1 'Inter Tight'; letter-spacing:-.04em}
.sc .vp{color:var(--muted); margin-top:6px; min-height:18px}
.parrow{display:flex; align-items:center; gap:12px; margin:14px 0}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
.actions .btn.red{flex:1 1 220px}

/* card */
.card{width:100%; border-collapse:collapse; margin-top:6px}
.card th,.card td{padding:9px 6px; border-bottom:1px solid var(--soft); text-align:left; vertical-align:top}
.card th{font:500 11px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-bottom:1px solid var(--line)}
.card td.n{font:700 16px 'Inter Tight'; width:34px}
.card td.s{font:900 20px/1 'Inter Tight'; text-align:center; width:56px}
.card th.s{text-align:center}
.card td.s.win{color:var(--red)}
.card td.f b{font-weight:700} .card td.f small{display:block; color:var(--muted); font-size:13px}
.card tfoot td{border-top:2px solid var(--line); border-bottom:0; font-weight:700}
.empty{color:var(--muted); padding:14px 0}

.rules{display:grid; grid-template-columns:1fr; gap:0; margin-top:4px}
.rules div{padding:12px 0; border-bottom:1px solid var(--soft)}
.rules b{font:900 20px 'Inter Tight'; letter-spacing:-.02em; display:block}
.rules span{color:var(--muted)}
.final{border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:22px 18px; margin-top:18px}
.final .big{font:900 clamp(40px,11vw,72px)/.9 'Inter Tight'; letter-spacing:-.05em}
.final .big i{font-style:normal; color:var(--red)}
.final p{margin:10px 0 0; opacity:.75}
.foot{display:flex; justify-content:space-between; gap:12px; margin-top:40px; padding-top:14px; border-top:2px solid var(--line); color:var(--muted)}
.foot a{color:inherit}
.hide{display:none !important}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .wheels.two{grid-template-columns:1fr}
  .card .hm{display:none}
}
@media (prefers-reduced-motion:reduce){ .wheel svg.w{transition-duration:.01s} .pop{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top mono"><a href="/" style="text-transform:none">← BuGGy Builds</a><span id="topRight">Golf · Team match</span></header>
  <h1>The<br>Spin<i>.</i></h1>

  <!-- SETUP -->
  <section id="setup">
    <div class="sec mono"><span><b>01 · Teams</b></span><span>Two a side</span></div>
    <div class="grid2" style="margin-top:14px">
      <div class="team">
        <h3><span class="sw a"></span>Team 1</h3>
        <label class="f"><span class="mono">Team name</span><input type="text" id="tA" maxlength="22" placeholder="Team 1"></label>
        <label class="f"><span class="mono">Players</span><input type="text" id="pA" maxlength="40" placeholder="e.g. Buggy & Nate"></label>
      </div>
      <div class="team">
        <h3><span class="sw b"></span>Team 2</h3>
        <label class="f"><span class="mono">Team name</span><input type="text" id="tB" maxlength="22" placeholder="Team 2"></label>
        <label class="f"><span class="mono">Players</span><input type="text" id="pB" maxlength="40" placeholder="e.g. Mike & Dave"></label>
      </div>
    </div>

    <div class="sec mono"><span><b>02 · Holes</b></span><span>Match play</span></div>
    <div style="margin-top:14px" class="seg" id="holesSeg"><button data-h="9">9 holes</button><button data-h="18">18 holes</button></div>

    <div class="sec mono"><span><b>03 · On the wheel</b></span><span>Tap to turn off</span></div>
    <div class="chips" id="fmtChips" style="margin-top:14px"></div>
    <p class="hint" id="fmtHint"></p>

    <div id="clubSetup">
      <div class="sec mono"><span><b>04 · One Club bag</b></span><span>Clubs the club wheel can land on</span></div>
      <div class="chips" id="clubChips" style="margin-top:14px"></div>
    </div>

    <div class="actions"><button class="btn red" id="start">Start the match →</button></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="hide">
    <div class="bar" id="bar"></div>
    <div class="hole">
      <div class="holehead"><div class="num" id="holeNum"></div><div class="row"><button class="btn ghost small" id="undo">↶ Undo last hole</button></div></div>

      <div class="wheels" id="wheels">
        <div class="wheelbox"><div class="lbl mono">Format</div><div class="wheelwrap" id="fmtTap"><div class="ptr"></div><div class="wheel" id="fmtWheel"><div class="hub">SPIN</div></div></div></div>
        <div class="wheelbox hide" id="clubBox"><div class="lbl mono">The one club</div><div class="wheelwrap"><div class="ptr"></div><div class="wheel" id="clubWheel"><div class="hub">CLUB</div></div></div></div>
      </div>
      <div class="actions" id="spinRow"><button class="btn red" id="spinBtn">Spin the wheel</button></div>

      <div id="after" class="hide">
        <div class="result pop" id="result"></div>
        <div class="parrow"><span class="mono" style="color:var(--muted)">Par</span><div class="seg" id="parSeg"><button data-p="3">3</button><button data-p="4">4</button><button data-p="5">5</button></div></div>
        <div class="scores" id="scores"></div>
        <div class="actions"><button class="btn red" id="save">Save hole →</button><button class="btn ghost" id="respin" title="Re-spin this hole">↻ Re-spin</button></div>
      </div>
    </div>

    <div id="finalBox"></div>

    <div class="sec mono"><span><b>Scorecard</b></span><span id="cardMeta"></span></div>
    <table class="card" id="card"></table>

    <div class="actions" style="margin-top:22px"><button class="btn ghost small" id="newRound">New match</button></div>
  </section>

  <div class="sec mono"><span><b>The formats</b></span><span>Lowest team score wins the hole</span></div>
  <div class="rules" id="rules"></div>

  <footer class="foot mono"><a href="/" style="text-transform:none">BuGGy Builds</a><span>The Spin</span></footer>
</div>

<script>
const FORMATS = {
  scramble: { name: 'Scramble', rule: 'Everyone hits, pick the best shot, everyone plays from there. Repeat until it’s in. One ball, one team score.' },
  shamble:  { name: 'Shamble',  rule: 'Everyone tees off and you pick the best drive. From there everyone plays their own ball in. Lowest ball on the team counts.' },
  bestball: { name: 'Best Ball', rule: 'Everyone plays their own ball the whole hole. Lowest score on the team counts.' },
  altshot:  { name: 'Alt Shot', rule: 'One ball per team. Partners take turns hitting it until it’s holed. Swap who tees off every alt shot hole.' },
  oneclub:  { name: 'One Club', rule: 'Spin for a club. Everyone plays the whole hole with only that club, putts included. Lowest score on the team counts.' },
};
const CLUBS = [
  ['Driver','DR'],['3 Wood','3W'],['5 Wood','5W'],['Hybrid','HY'],['4 Iron','4i'],['5 Iron','5i'],['6 Iron','6i'],['7 Iron','7i'],
  ['8 Iron','8i'],['9 Iron','9i'],['Pitching Wedge','PW'],['Gap Wedge','GW'],['Sand Wedge','SW'],['Lob Wedge','LW'],['Putter','PT'],
];
const KEY = 'buggybuilds.spin.v1';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let S = load() || fresh();
function fresh() {
  return { setup: { tA: '', pA: '', tB: '', pB: '', holes: 18, formats: Object.keys(FORMATS), clubs: CLUBS.map(c => c[0]).filter(c => c !== 'Putter') }, started: false, holes: [], cur: null };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.setup ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const nameA = () => S.setup.tA.trim() || 'Team 1';
const nameB = () => S.setup.tB.trim() || 'Team 2';
const altTurn = () => S.holes.filter(h => h.format === 'altshot').length; // count of alt shot holes so far

/* ---------- setup ---------- */
function renderSetup() {
  $('tA').value = S.setup.tA; $('pA').value = S.setup.pA; $('tB').value = S.setup.tB; $('pB').value = S.setup.pB;
  [...$('holesSeg').children].forEach(b => b.setAttribute('aria-pressed', +b.dataset.h === S.setup.holes));
  $('fmtChips').innerHTML = Object.entries(FORMATS).map(([k, f]) => `<button class="chip" data-k="${k}" aria-pressed="${S.setup.formats.includes(k)}">${f.name}</button>`).join('');
  $('clubChips').innerHTML = CLUBS.map(([c]) => `<button class="chip" data-c="${esc(c)}" aria-pressed="${S.setup.clubs.includes(c)}">${esc(c)}</button>`).join('');
  $('clubSetup').classList.toggle('hide', !S.setup.formats.includes('oneclub'));
  const nf = S.setup.formats.length, nc = S.setup.clubs.length;
  $('fmtHint').textContent = nf < 2 ? 'Keep at least two formats on the wheel.' : `${nf} formats on the wheel.`;
  $('start').disabled = nf < 2 || (S.setup.formats.includes('oneclub') && nc < 2);
}
['tA', 'pA', 'tB', 'pB'].forEach(id => $(id).addEventListener('input', e => { S.setup[id] = e.target.value; save(); }));
$('holesSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.setup.holes = +b.dataset.h; save(); renderSetup(); });
$('fmtChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k, f = S.setup.formats;
  S.setup.formats = f.includes(k) ? f.filter(x => x !== k) : Object.keys(FORMATS).filter(x => f.includes(x) || x === k);
  save(); renderSetup();
});
$('clubChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const c = b.dataset.c, l = S.setup.clubs;
  S.setup.clubs = l.includes(c) ? l.filter(x => x !== c) : CLUBS.map(x => x[0]).filter(x => l.includes(x) || x === c);
  save(); renderSetup();
});
$('start').addEventListener('click', () => { S.started = true; S.holes = []; S.cur = null; save(); show(); scrollTo({ top: 0, behavior: 'smooth' }); });

/* ---------- wheels ---------- */
const COLORS = () => { const cs = getComputedStyle(document.documentElement); return { ink: cs.getPropertyValue('--ink').trim(), paper: cs.getPropertyValue('--paper').trim(), red: cs.getPropertyValue('--red').trim(), soft: cs.getPropertyValue('--soft').trim() }; };
function wheelSVG(labels, radial) {
  const n = labels.length, seg = 360 / n, cx = 150, cy = 150, r = 146, C = COLORS();
  const pt = a => { const t = a * Math.PI / 180; return [cx + r * Math.sin(t), cy - r * Math.cos(t)]; };
  const fills = [C.red, C.ink, C.soft];
  const texts = [ '#fff', C.paper, C.ink ];
  let out = '';
  labels.forEach((lab, i) => {
    const a0 = i * seg - seg / 2, a1 = i * seg + seg / 2, [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const k = (n % 3 === 1 && i === n - 1) ? 1 : i % 3; // avoid two same colours touching at the seam
    out += `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fills[k]}" stroke="${C.paper}" stroke-width="2"/>`;
    const txt = esc(lab);
    out += radial
      ? `<g transform="rotate(${i * seg} ${cx} ${cy})"><text transform="translate(${cx} ${cy - r + 14}) rotate(90)" fill="${texts[k]}" font-family="Inter Tight" font-weight="900" font-size="${n > 12 ? 15 : 17}" dominant-baseline="middle">${txt}</text></g>`
      : `<g transform="rotate(${i * seg} ${cx} ${cy})"><text x="${cx}" y="${cy - r * .62}" fill="${texts[k]}" font-family="Inter Tight" font-weight="900" font-size="${n > 4 ? 17 : 20}" text-anchor="middle" dominant-baseline="middle">${txt}</text></g>`;
  });
  return `<svg class="w" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="149" fill="${C.ink}"/>${out}</svg>`;
}
const rot = { fmt: 0, club: 0 };
function mountWheel(el, labels, radial, key) {
  el.querySelectorAll('svg.w').forEach(s => s.remove());
  el.insertAdjacentHTML('beforeend', wheelSVG(labels, radial));
  const svg = el.querySelector('svg.w'); svg.style.transition = 'none'; svg.style.transform = `rotate(${rot[key]}deg)`; svg.getBoundingClientRect(); svg.style.transition = '';
}
function spinTo(el, n, idx, key) {
  const seg = 360 / n, cur = rot[key];
  const want = ((-idx * seg) % 360 + 360) % 360, have = ((cur % 360) + 360) % 360;
  const jitter = (Math.random() - .5) * seg * .6;
  rot[key] = cur + 360 * (4 + Math.floor(Math.random() * 2)) + ((want - have + 360) % 360) + jitter;
  const svg = el.querySelector('svg.w'); svg.style.transform = `rotate(${rot[key]}deg)`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  return new Promise(res => setTimeout(res, reduce ? 60 : 4300));
}
const pick = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };

let spinning = false;
async function spin(keepPar) {
  if (spinning) return; spinning = true;
  $('spinBtn').disabled = true; $('respin').disabled = true; $('after').classList.add('hide');
  const fk = S.setup.formats, clubs = S.setup.clubs;
  mountWheel($('fmtWheel'), fk.map(k => FORMATS[k].name), false, 'fmt');
  $('clubBox').classList.add('hide'); $('wheels').classList.remove('two');
  const fi = pick(fk.length), format = fk[fi];
  await spinTo($('fmtWheel'), fk.length, fi, 'fmt');
  let club = null;
  if (format === 'oneclub') {
    $('clubBox').classList.remove('hide'); $('wheels').classList.add('two');
    mountWheel($('clubWheel'), clubs.map(c => CLUBS.find(x => x[0] === c)[1]), true, 'club');
    await new Promise(r => setTimeout(r, 250));
    const ci = pick(clubs.length); club = clubs[ci];
    await spinTo($('clubWheel'), clubs.length, ci, 'club');
  }
  const prevPar = keepPar || (S.cur && S.cur.par);
  S.cur = { format, club, par: prevPar || 4, a: prevPar || 4, b: prevPar || 4 };
  save(); spinning = false; $('spinBtn').disabled = false; $('respin').disabled = false;
  renderHole(true);
}

/* ---------- match ---------- */
function tally() {
  let won = 0, lost = 0, sa = 0, sb = 0;
  S.holes.forEach(h => { sa += h.a; sb += h.b; if (h.a < h.b) won++; else if (h.b < h.a) lost++; });
  return { won, lost, sa, sb, diff: won - lost, played: S.holes.length, left: S.setup.holes - S.holes.length };
}
function status() {
  const t = tally();
  // a match is decided the moment one side leads by more holes than are left; keep that result (e.g. 4&3) even if they play on
  let d = 0, closed = null;
  S.holes.forEach((h, i) => { d += h.a < h.b ? 1 : h.b < h.a ? -1 : 0; const left = S.setup.holes - (i + 1); if (!closed && Math.abs(d) > left && left > 0) closed = { d, left }; });
  if (closed) { const lead = closed.d > 0 ? nameA() : nameB(); return { text: `${Math.abs(closed.d)}&${closed.left}`, who: closed.d > 0 ? 'a' : 'b', note: t.left ? `${lead} closed it out` : `${lead} wins`, done: true, t }; }
  const lead = t.diff > 0 ? nameA() : nameB(), up = Math.abs(t.diff);
  if (t.left === 0) return t.diff === 0 ? { text: 'Halved', who: '', note: 'All square after ' + t.played, done: true, t } : { text: `${up} UP`, who: t.diff > 0 ? 'a' : 'b', note: `${lead} wins`, done: true, t };
  if (!t.played) return { text: 'AS', who: '', note: 'All square · first tee', t };
  if (t.diff === 0) return { text: 'AS', who: '', note: `All square thru ${t.played}`, t };
  return { text: `${up} UP`, who: t.diff > 0 ? 'a' : 'b', note: `${lead}${up === t.left ? ' · dormie' : ''} thru ${t.played}`, t };
}
function renderBar() {
  const s = status(), t = s.t;
  $('bar').innerHTML = `<div class="side a"><span class="sw a"></span> ${esc(nameA())}<small>${t.won} won<br>${t.sa} strokes</small></div>
    <div class="mid"><div class="st ${s.who === 'a' ? 'a' : ''}">${s.text}</div><div class="thru mono">${esc(s.note)}</div></div>
    <div class="side b">${esc(nameB())} <span class="sw b"></span><small>${t.lost} won<br>${t.sb} strokes</small></div>`;
  $('topRight').textContent = `${S.setup.holes} holes · ${t.played} played`;
}
function vp(n, par) { const d = n - par; return d === 0 ? 'Par' : d === -1 ? 'Birdie' : d === -2 ? 'Eagle' : d <= -3 ? 'Albatross' : d === 1 ? 'Bogey' : d === 2 ? 'Double' : d === 3 ? 'Triple' : `+${d}`; }

function resultHTML(c) {
  const f = FORMATS[c.format];
  if (c.format === 'oneclub') return `<div class="fmt">One Club<i>:</i> ${esc(c.club)}</div><p>Everyone plays the whole hole with only the <b>${esc(c.club)}</b>, putts included. Lowest score on the team counts.</p>`;
  if (c.format === 'altshot') {
    const odd = altTurn() % 2 === 0;
    const tA = (S.setup.pA.split(/\s*(?:&|and|,|\/)\s*/i).filter(Boolean));
    const tB = (S.setup.pB.split(/\s*(?:&|and|,|\/)\s*/i).filter(Boolean));
    const who = (l, team) => l.length >= 2 ? esc(odd ? l[0] : l[1]) : (odd ? 'Player 1' : 'Player 2') + ` on ${esc(team)}`;
    return `<div class="fmt">${f.name}<i>.</i></div><p>${esc(f.rule)}</p><p>Teeing off this time: <b>${who(tA, nameA())}</b> and <b>${who(tB, nameB())}</b>.</p>`;
  }
  return `<div class="fmt">${f.name}<i>.</i></div><p>${esc(f.rule)}</p>`;
}
function renderHole(fresh) {
  const n = S.holes.length + 1, s = status();
  const over = n > S.setup.holes;
  $('holeNum').innerHTML = over ? 'Done<small>/ ' + S.setup.holes + '</small>' : `#${n}<small>of ${S.setup.holes}</small>`;
  $('undo').disabled = !S.holes.length || spinning;
  ['wheels', 'spinRow'].forEach(id => $(id).classList.toggle('hide', over));
  if (over) { $('after').classList.add('hide'); }
  if (!over && !spinning) {
    if (!$('fmtWheel').querySelector('svg.w')) mountWheel($('fmtWheel'), S.setup.formats.map(k => FORMATS[k].name), false, 'fmt');
    if (S.cur) {
      $('after').classList.remove('hide');
      const r = $('result'); r.innerHTML = resultHTML(S.cur);
      if (fresh) { r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop'); }
      [...$('parSeg').children].forEach(b => b.setAttribute('aria-pressed', +b.dataset.p === S.cur.par));
      $('scores').innerHTML = [['a', nameA()], ['b', nameB()]].map(([k, nm]) => `<div class="sc"><div class="who"><span class="sw ${k}"></span>${esc(nm)}</div>
        <div class="step"><button data-k="${k}" data-d="-1" aria-label="One less">−</button><output>${S.cur[k]}</output><button data-k="${k}" data-d="1" aria-label="One more">+</button></div>
        <div class="vp mono">${vp(S.cur[k], S.cur.par)}</div></div>`).join('');
      $('spinBtn').classList.add('hide');
      if (S.cur.format === 'oneclub' && S.cur.club) {
        $('clubBox').classList.remove('hide'); $('wheels').classList.add('two');
        if (!$('clubWheel').querySelector('svg.w')) mountWheel($('clubWheel'), S.setup.clubs.map(c => CLUBS.find(x => x[0] === c)[1]), true, 'club');
      }
    } else {
      $('after').classList.add('hide'); $('spinBtn').classList.remove('hide');
      $('clubBox').classList.add('hide'); $('wheels').classList.remove('two');
    }
  }
  renderBar(); renderCard(); renderFinal(s);
}
function renderFinal(s) {
  if (!s.done) { $('finalBox').innerHTML = ''; return; }
  const winner = s.who === 'a' ? nameA() : s.who === 'b' ? nameB() : '';
  const t = s.t, over = t.left === 0;
  $('finalBox').innerHTML = `<div class="final pop"><div class="mono" style="opacity:.6">${over ? 'Final' : 'Match closed out · play on for strokes'}</div>
    <div class="big">${winner ? esc(winner) + ' wins<i>.</i>' : 'All square<i>.</i>'}</div>
    <p>${s.text === 'Halved' ? 'Match halved' : s.text} · strokes ${t.sa}–${t.sb}</p></div>`;
}
function renderCard() {
  const h = S.holes;
  $('cardMeta').textContent = h.length ? `${h.length} of ${S.setup.holes}` : '';
  if (!h.length) { $('card').innerHTML = `<tbody><tr><td class="empty">Spin for hole 1 and the card fills in here.</td></tr></tbody>`; return; }
  const t = tally();
  $('card').innerHTML = `<thead><tr><th>#</th><th>Format</th><th class="hm">Par</th><th class="s">${esc(nameA().slice(0, 8))}</th><th class="s">${esc(nameB().slice(0, 8))}</th></tr></thead>
    <tbody>${h.map(x => `<tr><td class="n">${x.n}</td><td class="f"><b>${FORMATS[x.format].name}</b>${x.club ? `<small>${esc(x.club)}</small>` : ''}</td><td class="hm">${x.par}</td>
      <td class="s ${x.a < x.b ? 'win' : ''}">${x.a}</td><td class="s ${x.b < x.a ? 'win' : ''}">${x.b}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td></td><td>Holes won</td><td class="hm"></td><td class="s">${t.won}</td><td class="s">${t.lost}</td></tr>
    <tr><td></td><td>Strokes</td><td class="hm">${h.reduce((s, x) => s + x.par, 0)}</td><td class="s">${t.sa}</td><td class="s">${t.sb}</td></tr></tfoot>`;
}

$('spinBtn').addEventListener('click', () => spin());
$('fmtTap').addEventListener('click', () => { if (!S.cur && !$('spinBtn').classList.contains('hide')) spin(); });
$('respin').addEventListener('click', () => { const p = S.cur && S.cur.par; S.cur = null; spin(p); });
$('parSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !S.cur) return; const p = +b.dataset.p, d = p - S.cur.par; S.cur.par = p; S.cur.a = Math.max(1, S.cur.a + d); S.cur.b = Math.max(1, S.cur.b + d); save(); renderHole(); });
$('scores').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return; const k = b.dataset.k; S.cur[k] = Math.min(15, Math.max(1, S.cur[k] + +b.dataset.d)); save(); renderHole(); });
$('save').addEventListener('click', () => {
  if (!S.cur) return; const c = S.cur;
  S.holes.push({ n: S.holes.length + 1, format: c.format, club: c.club, par: c.par, a: c.a, b: c.b });
  S.cur = null; save(); renderHole();
  $('play').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('undo').addEventListener('click', () => { const h = S.holes.pop(); if (!h) return; S.cur = { format: h.format, club: h.club, par: h.par, a: h.a, b: h.b }; save(); $('spinBtn').classList.add('hide'); renderHole(); });
let armed = 0;
$('newRound').addEventListener('click', e => {
  if (Date.now() - armed > 3000) { armed = Date.now(); e.target.textContent = 'Tap again to wipe this match'; setTimeout(() => e.target.textContent = 'New match', 3000); return; }
  const keep = S.setup; S = fresh(); S.setup = keep; save(); e.target.textContent = 'New match'; show(); scrollTo({ top: 0 });
});

function show() {
  $('setup').classList.toggle('hide', S.started); $('play').classList.toggle('hide', !S.started);
  if (S.started) renderHole(); else { renderSetup(); $('topRight').textContent = 'Golf · Team match'; }
}
$('rules').innerHTML = Object.values(FORMATS).map(f => `<div><b>${f.name}</b><span>${esc(f.rule)}</span></div>`).join('');
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { $('fmtWheel').querySelector('svg.w')?.remove(); $('clubWheel').querySelector('svg.w')?.remove(); if (S.started) renderHole(); });
show();
</script>
</body>
</html>
